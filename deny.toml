# cargo-deny: licenses, advisories, bans and sources (CI job "cargo-deny" in test.yml).
#   cargo deny --all-features check
# Config format of cargo-deny 0.16+ (CI pins the version). The crate graph is every feature
# of every workspace member (gstreamer, native-rtsp, pushnoti, ...), on the platforms
# the project ships for.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-gnueabihf",
  "i686-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
# Vulnerabilities and unsound/yanked crates fail the check (the default for every
# advisory kind); unmaintained crates are reported only for crates this workspace uses
# directly. Ignore entries need a reason and are reviewed when their crate is updated.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # rustls-webpki 0.102.8: rumqttc 0.25.1 (latest) still depends on it, only for the
  # TlsError::WebPki variant. MQTT certificate checks run in rustls 0.23 with the
  # patched rustls-webpki 0.103. Remove when rumqttc drops rustls-webpki 0.102.
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102: rumqttc error type only; verification uses 0.103" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102: rumqttc error type only; verification uses 0.103" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102: rumqttc error type only; verification uses 0.103" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102: rumqttc error type only; verification uses 0.103" },
  # The `pushnoti` feature: fcm-push-listener 2.0.3 pins rustls 0.20 (and ring 0.16) and
  # reqwest 0.11 (h2 0.3), none of which has a patched release. Only fcm-push-listener 4
  # moves off them, and it replaces the sender-ID registration with a Firebase
  # app/project/API-key one: a rewrite of the push listener that needs a live FCM test.
  # Remove these when pushnoti moves to fcm-push-listener >= 4 (or is dropped).
  { id = "RUSTSEC-2024-0336", reason = "rustls 0.20 via fcm-push-listener 2 (pushnoti); no 0.20 fix" },
  { id = "RUSTSEC-2025-0009", reason = "ring 0.16 via fcm-push-listener 2 (pushnoti); no 0.16 fix, panics only with overflow checks" },
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3 via reqwest 0.11 in fcm-push-listener 2 (pushnoti); fixed only in h2 0.4" },
]

[licenses]
# neolink is AGPL-3.0-or-later; every dependency license must be compatible with it.
# The licenses actually in the tree (`cargo deny list -l license`); about.toml (the
# shipped third-party notice) accepts a superset.
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.9
# A license that leaves the tree is reported (warning), so the list stays the set in use
unused-allowed-license = "warn"

# Crates that name a license file instead of an SPDX expression. The hash pins the file
# the expression was read from: a changed file fails the check until it is re-read.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[licenses.private]
# Unpublished workspace crates (xtask, the fuzz crate) are checked like the rest
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between workspace members have no version requirement
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
