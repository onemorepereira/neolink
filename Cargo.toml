[package]
name = "neolink"
description = "A standards-compliant bridge to Reolink IP cameras"
version = "0.6.3-rc.3"
authors = ["George Hilliard <thirtythreeforty@gmail.com>", "Andrew King <sheepchaan@gmail.com>"]
edition = "2018"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[workspace]
members = [
  "crates/*",
]
exclude = ["crates/rtsp/fuzz", "crates/rtsp-it"]

[dependencies]
anyhow = "1.0.70"
base64 = "0.22.0"
byte-slice-cast = {version = "1.2.2", optional = true}
bytes = "1.6.0"
clap = { version = "4.2.2", features = ["derive", "cargo"] }
crossbeam-channel = {version = "0.5.8", optional = true}
dirs = {version = "5.0.1", optional = true}
env_logger = "0.11.3"
fcm-push-listener = {version = "4.1.1", optional = true}
futures = "0.3.28"
gstreamer = {version = "0.23.0", optional = true}
gstreamer-app = { version = "0.23.0", features = ["v1_20"], optional = true }
gstreamer-rtsp = { version = "0.23.0", features = ["v1_20"], optional = true }
gstreamer-rtsp-server = { version = "0.23.0", features = ["v1_20"], optional = true }
heck = "0.5.0"
log = { version = "0.4.17", features = [ "release_max_level_debug" ] }
md5 = {version = "0.7.0", optional = true}
neolink_core = { path = "crates/core", version = "0.6.3-rc.3" }
neolink_rtsp = { path = "crates/rtsp", version = "0.6.3-rc.3", optional = true }
once_cell = "1.19.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1.7.3"
# The HTTP client type fcm-push-listener takes (pushnoti)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"], optional = true }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
# ring as rustls' crypto provider for MQTT over TLS (rumqttc's default would build
# aws-lc-rs), installed at startup; tls12 keeps TLS 1.2 brokers working
rustls = { version = "0.23.31", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.96"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "io-util", "tracing", "signal", "net", "time", "sync"] }
tokio-stream = "0.1.12"
tokio-util = { version = "0.7.7", features = ["full", "tracing"] }
toml = "0.8.2"
axum = { version = "0.7", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4"] }
validator = {version="0.20.0", features = ["derive"] }
rusty_h264-decoder = { version = "0.16.1", optional = true, default-features = false, features = ["std", "libm"] }
rusty_h265 = { version = "0.6.2", optional = true }
jpeg-encoder = { version = "0.7.1", optional = true }

[dev-dependencies]
neolink_core = { path = "crates/core", version = "0.6.3-rc.3", features = ["test-util"] }
tokio = { version = "1.39", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.153"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5"

[features]
default = ["gstreamer"]
gstreamer = [
  "dep:gstreamer",
  "dep:gstreamer-app",
  "dep:gstreamer-rtsp",
  "dep:gstreamer-rtsp-server",
  "dep:byte-slice-cast",
  "dep:crossbeam-channel"
]
# The GStreamer-free RTSP server (crates/rtsp); not default during the beta (SPEC §8)
native-rtsp = ["dep:neolink_rtsp"]
# Log task and permit counts on SIGUSR1 (for leak checks on hardware)
debug-stats = []
pushnoti = [
  "dep:fcm-push-listener",
  "dep:reqwest",
  "dep:dirs",
  "dep:md5"
]
# HTTP configuration API (open, no auth; exposure controlled at the k3s layer)
api = ["dep:reqwest"]
# Pure-Rust stream-based snapshot for cameras that do not support MSG_ID_SNAP
# (e.g. Argus PT Ultra). Adds H.264/H.265 decode + JPEG encode via pure-Rust
# crates; no GStreamer, no FFI, stays FROM-scratch compatible.
native-snapshot = ["dep:rusty_h264-decoder", "dep:rusty_h265", "dep:jpeg-encoder"]

[profile.release]
# Smaller binaries (PLAN 1.8)
strip = "symbols"
