[package]
name = "xtask"
description = "Development tasks for neolink: fixture generation and golden transcripts"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.70"
clap = { version = "4.2.2", features = ["derive"] }
env_logger = "0.11.3"
neolink_core = { path = "../core", features = ["test-util"] }
neolink_rtsp = { path = "../rtsp" }
tokio-util = "0.7.7"
serde_json = "1.0.96"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
regex = "1.7.3"
sha2 = "0.10.8"
