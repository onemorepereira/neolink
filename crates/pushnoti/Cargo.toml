[package]
name = "pushnoti"
version = "0.6.3-rc.3"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.71"
clap = { version = "4.2.2", features = ["derive", "cargo"] }
env_logger = "0.10.0"
fcm-push-listener = { version = "4.1.1" }
lazy_static = "1.4.0"
log = { version = "0.4.17", features = [ "release_max_level_debug" ] }
neolink_core = { path = "../core", version = "0.6.3-rc.3" }
once_cell = "1.19.0"
regex = "1.8.1"
reqwest = { version = "0.13.5", default-features = false }
serde = "1.0.163"
serde_json = "1.0.96"
tokio = { version = "1.28.1", features = ["full"] }
tokio-stream = "0.1.12"
toml = "0.8.2"
validator = {version="0.20.0", features = ["derive"] }
