[package]
name = "neolink_rtsp-it"
description = "Client integration tests for neolink_rtsp with the newest retina (PLAN 3.9)"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# Not a workspace member: retina's dependencies must not move the workspace lockfile
# (retina >= 0.4.14 needs Rust 1.88, the workspace MSRV since the time 0.3.47 update)
[workspace]

[dependencies]

[dev-dependencies]
neolink_rtsp = { path = "../rtsp" }
retina = "=0.4.21"
url = "2.5.0"
futures = "0.3.28"
bytes = "1.6.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = "0.7.7"
env_logger = "0.11.3"
log = "0.4.17"
