[package]
name = "neolink_rtsp"
description = "A GStreamer-free RTSP 1.0 server for live camera streams"
version = "0.6.3-rc.3"
authors = ["Andrew King <sheepchaan@gmail.com>"]
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
base64 = "0.22.0"
bytes = "1.6.0"
futures = "0.3.28"
hmac = "0.12.1"
tokio = { version = "1.39", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7.7"
log = "0.4.17"
md5 = "0.7.0"
rand = "0.8.5"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.96"
sha2 = "0.10.8"

[dev-dependencies]
env_logger = "0.11.3"
tokio = { version = "1.39", features = ["rt", "macros", "sync", "time", "net", "io-util", "test-util", "rt-multi-thread"] }
symphonia = { version = "0.5.4", default-features = false, features = ["aac"] }
