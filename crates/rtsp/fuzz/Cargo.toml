[package]
name = "neolink_rtsp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1.6.0"
neolink_rtsp = { path = ".." }

# Not a member of the workspace: cargo-fuzz needs nightly
[workspace]

[[bin]]
name = "annexb"
path = "fuzz_targets/annexb.rs"
test = false
doc = false

[[bin]]
name = "adts"
path = "fuzz_targets/adts.rs"
test = false
doc = false

[[bin]]
name = "sps"
path = "fuzz_targets/sps.rs"
test = false
doc = false
