name: Nightly

# PLAN 5.5/5.6: long fuzzing, the 90 min Frigate and A/V runs, and the soak. Hosted
# runners stop a job after 6 h, so the soak runs 5 h here; the 24 h soak (A15 surrogate)
# needs a self-hosted runner: SOAK_SECS=86400.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-10-13-04/ffmpeg-n8.1.3-17-gc389840894-linux64-gpl-8.1.tar.xz
  FFMPEG_SHA256: fc332aa9e6d204ea674432c9e2c53696f75ff6d7d11de337b286bde494d7c583

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }} (30 min)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [annexb, adts, sps, rtsp_msg, rtsp_headers]
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - working-directory: crates/rtsp/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=1800
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: crates/rtsp/fuzz/artifacts

  long:
    name: Frigate 90 min, A/V 90 min, soak 5 h
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: apt install gstreamer and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstrtspserver-1.0-dev \
            libgstreamer1.0-dev libgtk2.0-dev protobuf-compiler libssl-dev
      - name: Fetch pinned ffmpeg
        run: |
          mkdir -p ~/ffmpeg
          curl -sSL -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg.tar.xz -C ~/ffmpeg --strip-components=1
          echo "NEOLINK_FFMPEG=$HOME/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo xtask mkfixture --standard --out fixtures/synth
          cargo build --release --features native-rtsp -p neolink -p xtask
      - name: A3, Frigate presets for 90 min across the wrap
        run: E2E_WORK=$(mktemp -d) A3_SECS=5400 TESTS=A3 tests/e2e/frigate.sh
      - name: A16 for 90 min, through neolink
        run: E2E_WORK=$(mktemp -d) AV_SECS=5400 SERVER=neolink tests/e2e/avsync.sh
      - name: Soak, 5 h through neolink
        run: E2E_WORK=$(mktemp -d) SOAK_SECS=18000 tests/e2e/soak.sh
