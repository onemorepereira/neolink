name: Test

on:
  push:
  workflow_dispatch:

env:
  # Static ffmpeg pinned for every ffmpeg-based test and for fixture generation: request
  # shapes, error strings and encoder output differ between ffmpeg versions.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-10-13-04/ffmpeg-n8.1.3-17-gc389840894-linux64-gpl-8.1.tar.xz
  FFMPEG_SHA256: fc332aa9e6d204ea674432c9e2c53696f75ff6d7d11de337b286bde494d7c583

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: apt install gstreamer and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstrtspserver-1.0-dev \
            libgstreamer1.0-dev libgtk2.0-dev protobuf-compiler libssl-dev
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}
      - name: Fetch pinned ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg
          curl -sSL -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg.tar.xz -C ~/ffmpeg --strip-components=1
      - name: Use pinned ffmpeg
        run: |
          echo "NEOLINK_FFMPEG=$HOME/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "NEOLINK_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Generate fixtures and check they are reproducible
        run: |
          cp fixtures/synth/SHA256SUMS /tmp/SHA256SUMS
          cargo xtask mkfixture --standard --out fixtures/synth --check /tmp/SHA256SUMS
      - name: cargo test
        run: |
          cargo test --workspace
          cargo test --workspace --features native-rtsp
      - name: A/V sync through the native server (A16, 5 s, 60 s and 15 min)
        run: |
          E2E_WORK=$(mktemp -d) AV_SECS="5 60 900" tests/e2e/avsync.sh
          E2E_WORK=$(mktemp -d) AV_SECS="5 60 900" SERVER=neolink tests/e2e/avsync.sh
      - name: retina client tests (A6, A17, A22; own lockfile, newest retina)
        run: cargo test --locked --manifest-path crates/rtsp-it/Cargo.toml
      - name: Golden structural diff, native server vs GStreamer (A19)
        run: |
          cargo build --release --features native-rtsp -p neolink -p xtask
          E2E_WORK=$(mktemp -d) tests/e2e/golden-native.sh
          # Gate 4: the same through neolink and the scripted camera
          E2E_WORK=$(mktemp -d) SERVER=neolink tests/e2e/golden-native.sh

  msrv:
    name: MSRV (1.82)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.82
        run: |
          rustup toolchain install 1.82 --profile minimal
          rustup override set 1.82
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: |
          cargo check --locked --all-targets -p neolink_core -p neolink_rtsp -p xtask -p neolink_decoder -p mailnoti
          cargo check --locked --bin neolink --no-default-features
          cargo check --locked --bin neolink --no-default-features --features native-rtsp

  clients:
    name: Client matrix (A1, A2, A2b, A4, A4b, A5, A10)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ffmpeg
        run: |
          mkdir -p ~/ffmpeg
          curl -sSL -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg.tar.xz -C ~/ffmpeg --strip-components=1
      - name: Build the dev and client images
        run: |
          podman build -t neolink-dev -f tests/e2e/dev/Containerfile tests/e2e/dev
          podman build -t neolink-clients -f tests/e2e/clients/Containerfile tests/e2e/clients
      - name: Fixtures, xtask and the client matrix
        run: |
          podman run --rm --network host -v "$PWD:/src:z" -v "$HOME/ffmpeg:/ffmpeg:ro,z" \
            -e NEOLINK_FFMPEG=/ffmpeg/bin/ffmpeg -e PATH=/usr/local/cargo/bin:/usr/bin:/bin:/ffmpeg/bin \
            -e A5_SECS=300 -w /src neolink-clients sh -c \
            'cargo xtask mkfixture --standard --out fixtures/synth && cargo build --release --features native-rtsp -p neolink -p xtask && E2E_WORK=$(mktemp -d) sh tests/e2e/clients.sh && E2E_WORK=$(mktemp -d) SERVER=neolink sh tests/e2e/clients.sh'
