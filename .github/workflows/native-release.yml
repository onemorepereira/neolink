name: Native release artifacts

# PLAN 6.1-6.4: static musl binaries of the native build (no GStreamer) for x86_64 and
# aarch64, the license notice, and the FROM-scratch image as a tarball.
# Artifacts only: this workflow publishes nothing. Its token is read-only, it logs in to
# no registry and uses no secrets; the outputs are workflow artifacts (90-day retention)
# that someone downloads and releases by hand.
# Runs on a v*-native* tag, or by hand from master or a tag (not from other branches).
on:
  push:
    tags: ["v*-native*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build images, by digest. rust:1.90.0-alpine3.20 for x86_64; for aarch64 the
  # rust-musl-cross image has no versioned tags, so the aarch64-musl tag as of 2026-07-01
  # by digest, with Rust 1.90.0 installed in it.
  RUST_ALPINE: docker.io/library/rust:1.90.0-alpine3.20@sha256:ef86f37c2819ebd1ecb1dbd7efda70c693cb013232688aa136a5a2f1e3b65e55
  MUSL_CROSS: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643

jobs:
  guard:
    name: Allowed ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only master or a tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/master|refs/tags/*) echo "building $REF" ;;
            *) echo "::error::native release artifacts are built from master or a tag, not $REF"; exit 1 ;;
          esac

  x86_64:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build in ${{ env.RUST_ALPINE }}
        run: |
          # GITHUB_SHA: build.rs puts the commit in --version
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_SHA "$RUST_ALPINE" sh -c \
            'apk add --no-cache musl-dev protobuf-dev perl make \
             && cargo build --release --locked --no-default-features --features native-rtsp \
             && ./target/release/neolink --version'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neolink-native-x86_64-linux-musl
          path: target/release/neolink
          if-no-files-found: error

  aarch64:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build in ${{ env.MUSL_CROSS }}
        run: |
          # JEMALLOC_SYS_WITH_LG_PAGE=16: 64 KiB pages, as on the Raspberry Pi 5 and many
          # arm64 server kernels
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_SHA -e JEMALLOC_SYS_WITH_LG_PAGE=16 "$MUSL_CROSS" bash -c \
            'set -e
             apt-get update && apt-get install -y --no-install-recommends protobuf-compiler
             rustup toolchain install 1.90.0 --profile minimal --target aarch64-unknown-linux-musl
             cargo +1.90.0 build --release --locked --no-default-features --features native-rtsp'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neolink-native-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/neolink
          if-no-files-found: error

  licenses:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-about 0.9.2 (release binary, sha256-checked)
        run: |
          v=0.9.2; f=cargo-about-$v-x86_64-unknown-linux-musl
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f.tar.gz" "https://github.com/EmbarkStudios/cargo-about/releases/download/$v/$f.tar.gz"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$f/cargo-about" ~/.cargo/bin/cargo-about
      - run: cargo about generate --locked --no-default-features --features native-rtsp about.hbs -o THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  image:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: podman build -t localhost/neolink:native -f Dockerfile.native .
      - run: podman run --rm localhost/neolink:native --version
      - run: podman save -o neolink-native.tar localhost/neolink:native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neolink-native-image
          path: neolink-native.tar
          if-no-files-found: error
