name: CI

# Release builds of the GStreamer backend for every platform upstream ships, as workflow
# artifacts, and a draft GitHub release from them on a version tag. This fork pushes no
# images: upstream's Docker Hub push (and the Docker Hub prune workflow) are removed.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The cross builds use the MSRV, as upstream did
  rust_version: "1.88.0"
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-15: arm64; macos-15-intel: the last Intel macOS image (macos-12 and
        # macos-13 are retired)
        os: [ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        name: apt install linux deps
        run: |
          sudo apt-get update
          # The runner image ships libunwind-14-dev, which conflicts with the libunwind-dev
          # that libgstreamer1.0-dev needs; naming libunwind-dev makes apt swap them
          sudo apt-get install -y --no-install-recommends libunwind-dev libgstrtspserver-1.0-dev \
            libgstreamer1.0-dev libgtk2.0-dev protobuf-compiler libssl-dev
      - if: runner.os == 'Windows'
        name: Install Windows deps
        shell: pwsh
        run: |
          # GStreamer from gstreamer.freedesktop.org, pinned and checked. Old point releases
          # are deleted there; the last release of a series (1.24.13) is kept.
          $base = 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc'
          $msis = @{
            'gstreamer-1.0-msvc-x86_64-1.24.13.msi' = '66915d82adda34189703c36a5d2ef145d2e3afb7afc12c66fcf2ea506e2466d2'
            'gstreamer-1.0-devel-msvc-x86_64-1.24.13.msi' = '0afb4394c2cba3999c0f5e74f28c2ac5d98f03131140e09246d4dcd60a0a0395'
          }
          foreach ($msi in $msis.Keys) {
            $file = Join-Path $env:RUNNER_TEMP $msi
            Invoke-WebRequest -Uri "$base/$msi" -OutFile $file
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            if ($hash -ne $msis[$msi]) { throw "$msi sha256 $hash, expected $($msis[$msi])" }
            $p = Start-Process msiexec -ArgumentList '/i', "`"$file`"", '/qn', 'ADDLOCAL=ALL' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec $msi exited $($p.ExitCode)" }
          }
          # The installer sets the root machine-wide; this step's environment predates it
          $env:GSTREAMER_1_0_ROOT_MSVC_X86_64 = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $env:GSTREAMER_1_0_ROOT_MSVC_X86_64) { throw 'GSTREAMER_1_0_ROOT_MSVC_X86_64 not set by the installer' }
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GSTREAMER_1_0_ROOT_MSVC_X86_64"

          # Proto buffers
          choco install -y --no-progress protoc --version=24.2.0

          # Open SSL
          choco install -y --no-progress openssl --version=1.1.1.2100
          $env:OPENSSL_DIR=$env:SYSTEMDRIVE + '\Program Files\OpenSSL-Win64\'

          # Alternative openssl location (depends on version that gets installed by choco)
          if (-not (Test-Path -Path "$env:OPENSSL_DIR" -PathType Container)) {
            $env:OPENSSL_DIR=$env:SYSTEMDRIVE + '\Program Files\OpenSSL\'
          }
          # Github runners work on both C or D drive and figuring out which was used is difficult
          if (-not (Test-Path -Path "$env:OPENSSL_DIR" -PathType Container)) {
            $env:OPENSSL_DIR='D:\\Program Files\OpenSSL-Win64\'
          }
          # Or course we could be on alternative location and drive....
          if (-not (Test-Path -Path "$env:OPENSSL_DIR" -PathType Container)) {
            $env:OPENSSL_DIR='D:\\Program Files\OpenSSL\'
          }

          # Set github vars
          Add-Content -Path $env:GITHUB_ENV  -Value "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GSTREAMER_1_0_ROOT_MSVC_X86_64"
          Add-Content -Path $env:GITHUB_PATH  -Value "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin"
          Add-Content -Path $env:GITHUB_ENV  -Value "OPENSSL_DIR=$env:OPENSSL_DIR"

          # One last check on directories
          dir "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64"
          dir "$env:OPENSSL_DIR"
      - if: runner.os == 'macOS'
        name: Install macOS deps
        run: |
          # Pinned and checked; old point releases are deleted upstream, the last release of a
          # series (1.24.13) is kept. The runtime package, then the headers and .pc files.
          base=https://gstreamer.freedesktop.org/data/pkg/osx/1.24.13
          while read -r sha pkg; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$pkg" "$base/$pkg"
            echo "$sha  $RUNNER_TEMP/$pkg" | shasum -a 256 -c -
            sudo installer -pkg "$RUNNER_TEMP/$pkg" -target /
          done <<'PKGS'
          a18458c7cd61e5f2c71bb17c6eb88d54493adb964ec30dd53d96244aac537839 gstreamer-1.0-1.24.13-universal.pkg
          95633de7eec859e1dbfc4e8e7b650b78a47a31075735eee7550ccf9b919ba398 gstreamer-1.0-devel-1.24.13-universal.pkg
          PKGS
          PKG_CONFIG_PATH="/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          PKG_CONFIG_GSTREAMER_1_0_PREFIX="/Library/Frameworks/GStreamer.framework/Versions/1.0"
          {
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"
            echo "PKG_CONFIG_GSTREAMER_1_0_PREFIX=${PKG_CONFIG_GSTREAMER_1_0_PREFIX}"
          } >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"
          # openssl@1.1 is disabled in Homebrew; openssl-sys builds against 3.x
          brew install pkg-config protobuf openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "${GITHUB_ENV}"
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        shell: bash
        run: |
          echo "PATH=${PATH}"
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=${GSTREAMER_1_0_ROOT_MSVC_X86_64:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          export JEMALLOC_SYS_WITH_LG_PAGE=16
          cargo build --locked --release --features gstreamer,pushnoti
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: "target/release/neolink*"
          if-no-files-found: error

  cross:
    name: cross ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: docker.io/library/debian:bookworm-20261005-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
    strategy:
      fail-fast: false
      matrix:
        # Everyone has a slightly different screwball naming scheme;
        # Rust uses the target triple, GCC generally targets a family
        # with a specific prefix, and dpkg's arch does its own thing
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            gcc: x86-64-linux-gnu
            pkgconfig: x86_64-linux-gnu
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
            gcc: arm-linux-gnueabihf
            pkgconfig: arm-linux-gnueabihf
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            gcc: aarch64-linux-gnu
            pkgconfig: aarch64-linux-gnu
          - arch: i386
            target: i686-unknown-linux-gnu
            gcc: i686-linux-gnu
            # on i686, the pkgconfig path doesn't match the prefix!
            pkgconfig: i386-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install basic tools
        run: |
          apt-get update
          apt-get install --assume-yes --no-install-recommends curl ca-certificates protobuf-compiler
      - name: Install ${{ matrix.arch }} cross compiler and gstreamer
        env:
          ARCH: ${{ matrix.arch }}
          GCC: ${{ matrix.gcc }}
        run: |
          dpkg --add-architecture "$ARCH"
          apt-get update
          apt-get install --assume-yes --no-install-recommends \
          build-essential \
          "gcc-$GCC" \
          "g++-$GCC" \
          "libgstrtspserver-1.0-dev:$ARCH" \
          "libgstreamer1.0-dev:$ARCH" \
          "libgtk2.0-dev:$ARCH" \
          "libglib2.0-dev:$ARCH" \
          "libssl-dev:$ARCH"
      - name: Install rustup and the ${{ env.rust_version }} toolchain for ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- --no-modify-path --quiet -y \
            --profile minimal --default-toolchain "${rust_version}" --target "${TARGET}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - name: Build
        run: |
          cargo build --locked --release --verbose --features gstreamer,pushnoti --target="${TARGET}"
        env:
          # Retarget pkg-config as described in https://www.freedesktop.org/wiki/Software/pkg-config/CrossCompileProposal/
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_LIBDIR: /usr/lib/${{ matrix.pkgconfig }}/pkgconfig
          TARGET: ${{ matrix.target }}
          JEMALLOC_SYS_WITH_LG_PAGE: 16
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}-bookworm
          path: "target/${{ matrix.target }}/release/neolink*"
          if-no-files-found: error

  create_release:
    name: Create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A version tag pushed by hand only; native tags (v*-native*) are native-release.yml's
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && !contains(github.ref, '-native')
    needs:
      - "cross"
      - "native"
    permissions:
      # The one write permission in CI: creating the draft release on a tag
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Get project version
        id: version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "neolink") | .version')
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - name: Download the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Prepare releases
        run: |
          # artifact name -> release zip name
          set -- \
            release-windows-2022 neolink_windows \
            release-macos-15-intel neolink_macos_intel \
            release-macos-15 neolink_macos_m1 \
            release-ubuntu-22.04 neolink_linux_x86_64_ubuntu \
            release-amd64-bookworm neolink_linux_x86_64_bookworm \
            release-armhf-bookworm neolink_linux_armhf \
            release-arm64-bookworm neolink_linux_arm64 \
            release-i386-bookworm neolink_linux_i386
          while [ $# -gt 0 ]; do
            mv "artifacts/$1" "$2"
            chmod +x "$2/neolink"*
            zip -r "$2.zip" "$2"
            shift 2
          done
      - name: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Neolink ${{ steps.version.outputs.version }}
          files: |
            neolink_windows.zip
            neolink_macos_intel.zip
            neolink_macos_m1.zip
            neolink_linux_x86_64_ubuntu.zip
            neolink_linux_x86_64_bookworm.zip
            neolink_linux_armhf.zip
            neolink_linux_arm64.zip
            neolink_linux_i386.zip
          body: |
            Neolink release ${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
